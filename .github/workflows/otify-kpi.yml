name: Notify KPI Hub

on:
  push:
    branches:
      - '**'
  create:
  delete:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch KPI update
        env:
          PAT_TOKEN: ${{ secrets.KPI_DISPATCH_TOKEN }}
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${PAT_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/jose6668/FarmaExpres/dispatches \
            -d '{"event_type":"kpi-update","client_payload":{"source_repo":"${{ github.repository }}","ref":"${{ github.ref }}","actor":"${{ github.actor }}"}}'