name: Update KPI Participation

on:
  workflow_dispatch:
  repository_dispatch:
    types: [kpi-update]
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: update-kpi
  cancel-in-progress: true

jobs:
  recalculate-kpi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run KPI generator
        env:
          GH_TOKEN: ${{ secrets.KPI_GH_TOKEN }}
        run: python scripts/update_kpi.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md kpi-data.json
          git add kpi-repos.json || true
          git diff --cached --quiet || git commit -m "chore: update team participation KPI"

      - name: Push changes
        run: git push